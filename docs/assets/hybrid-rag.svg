<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-label="BRAG Hybrid RAG retrieval: vector search plus keyword search fused with reciprocal rank fusion" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111726" stroke-width="1"/>
    </pattern>
    <marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="590" rx="16" fill="#090C16"/>
  <rect width="1000" height="590" rx="16" fill="url(#g4)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="999" height="589" rx="16" fill="none" stroke="#1D2536"/>
  <text x="34" y="34" font-size="11" letter-spacing="3" fill="#475569">HYBRID RAG 2.0</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a4)">
    <path d="M500 96 V116 H250 V140"/>
    <path d="M500 96 V116 H750 V140"/>
    <path d="M250 250 V276"/>
    <path d="M750 250 V276"/>
    <path d="M250 322 V344 H500 V366"/>
    <path d="M750 322 V344 H500 V366"/>
    <path d="M500 426 V450"/>
  </g>

  <!-- query -->
  <rect x="370" y="48" width="260" height="48" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <text x="500" y="70" text-anchor="middle" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">USER QUERY</text>
  <text x="500" y="87" text-anchor="middle" font-size="10" fill="#64748B">described in the developer&#8217;s own words</text>

  <!-- vector lane -->
  <rect x="110" y="140" width="280" height="110" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="110" y="140" width="3" height="110" rx="1.5" fill="#A78BFA"/>
  <text x="130" y="166" font-size="12" letter-spacing="1.4" fill="#E2E8F0">VECTOR SEARCH</text>
  <text x="130" y="190" font-size="10" fill="#94A3B8">gemini-embedding-001 &#183; 768d</text>
  <text x="130" y="208" font-size="10" fill="#94A3B8">pgvector &#183; HNSW cosine index</text>
  <text x="130" y="232" font-size="9.5" fill="#64748B">catches problems described</text>
  <text x="130" y="245" font-size="9.5" fill="#64748B">differently from the source text</text>

  <!-- keyword lane -->
  <rect x="610" y="140" width="280" height="110" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="610" y="140" width="3" height="110" rx="1.5" fill="#38BDF8"/>
  <text x="630" y="166" font-size="12" letter-spacing="1.4" fill="#E2E8F0">KEYWORD SEARCH</text>
  <text x="630" y="190" font-size="10" fill="#94A3B8">lexical ranking</text>
  <text x="630" y="208" font-size="10" fill="#94A3B8">exact technical identifiers</text>
  <text x="630" y="232" font-size="9.5" fill="#64748B">error codes, config keys,</text>
  <text x="630" y="245" font-size="9.5" fill="#64748B">middleware and framework names</text>

  <rect x="150" y="276" width="200" height="46" rx="9" fill="#0B1120" stroke="#28314A"/>
  <text x="250" y="304" text-anchor="middle" font-size="10.5" fill="#94A3B8">semantic ranking</text>
  <rect x="650" y="276" width="200" height="46" rx="9" fill="#0B1120" stroke="#28314A"/>
  <text x="750" y="304" text-anchor="middle" font-size="10.5" fill="#94A3B8">lexical ranking</text>

  <!-- RRF -->
  <rect x="340" y="366" width="320" height="60" rx="10" fill="#120E22" stroke="#8B5CF6"/>
  <text x="500" y="392" text-anchor="middle" font-size="12.5" letter-spacing="1.6" fill="#E9E4FF">RECIPROCAL RANK FUSION</text>
  <text x="500" y="411" text-anchor="middle" font-size="10" fill="#94A3B8">two independent signals, one robust ordering</text>

  <!-- output -->
  <rect x="300" y="450" width="400" height="64" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <text x="500" y="475" text-anchor="middle" font-size="12" letter-spacing="1.4" fill="#E2E8F0">TOP CONTEXT &#8594; LLM</text>
  <text x="500" y="495" text-anchor="middle" font-size="9.5" fill="#8B93A7">measured typical top-3 context: ~1,500&#8211;2,200 chars (~400&#8211;550 tokens)</text>
  <text x="500" y="509" text-anchor="middle" font-size="9.5" fill="#64748B">down from a broad ~4,000&#8211;6,000 char strategy</text>

  <!-- corpus strip -->
  <rect x="60" y="536" width="880" height="34" rx="9" fill="#0B1120" stroke="#28314A"/>
  <text x="80" y="558" font-size="10" fill="#64748B">CORPUS</text>
  <text x="150" y="558" font-size="10" fill="#94A3B8">81 chunks &#183; 3 curated sources &#183; 0 ingestion errors &#183; ingested on demand via</text>
  <text x="606" y="558" font-size="10" fill="#C4B5FD">npm run ingest:rag</text>
</svg>

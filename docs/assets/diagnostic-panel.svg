<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 700" width="940" height="700" role="img" aria-label="Representative mockup of a BRAG structured diagnostic response" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="940" height="700" rx="14" fill="#0A0E1A" stroke="#1D2536"/>

  <!-- window chrome -->
  <path d="M0 14 A14 14 0 0 1 14 0 H926 A14 14 0 0 1 940 14 V52 H0 Z" fill="#0E1424"/>
  <line x1="0" y1="52" x2="940" y2="52" stroke="#1D2536"/>
  <circle cx="28" cy="26" r="5" fill="#FB7185" opacity="0.7"/>
  <circle cx="46" cy="26" r="5" fill="#FBBF24" opacity="0.7"/>
  <circle cx="64" cy="26" r="5" fill="#34D399" opacity="0.7"/>
  <text x="92" y="31" font-size="11" letter-spacing="1.4" fill="#94A3B8">mechamaru &#183; diagnostic</text>
  <rect x="700" y="14" width="106" height="24" rx="12" fill="#160F26" stroke="#3A2E63"/>
  <text x="753" y="30" text-anchor="middle" font-size="9.5" letter-spacing="1" fill="#C4B5FD">HIGH &#183; 900 tok</text>
  <rect x="814" y="14" width="98" height="24" rx="12" fill="#0B1626" stroke="#1E4A66"/>
  <text x="863" y="30" text-anchor="middle" font-size="9.5" letter-spacing="1" fill="#7CC7EC">2 tool calls</text>

  <!-- FINDING -->
  <text x="40" y="86" font-size="10" letter-spacing="2.4" fill="#A78BFA">FINDING</text>
  <text x="40" y="110" font-size="12.5" fill="#E2E8F0">A resource requested by the deployed frontend returns 404 at runtime.</text>
  <text x="40" y="130" font-size="11" fill="#94A3B8">The page renders, but one referenced asset never resolves.</text>
  <line x1="40" y1="152" x2="900" y2="152" stroke="#1A2233"/>

  <!-- WHY -->
  <text x="40" y="178" font-size="10" letter-spacing="2.4" fill="#A78BFA">WHY THIS IS HAPPENING</text>
  <text x="40" y="202" font-size="11.5" fill="#CBD5E1">The requested path is resolved by the host at request time, so the failure is visible only</text>
  <text x="40" y="221" font-size="11.5" fill="#CBD5E1">in the browser and not in the build output.</text>
  <line x1="40" y1="243" x2="900" y2="243" stroke="#1A2233"/>

  <!-- EVIDENCE -->
  <text x="40" y="269" font-size="10" letter-spacing="2.4" fill="#A78BFA">EVIDENCE</text>

  <rect x="40" y="282" width="860" height="38" rx="8" fill="#0B1A16" stroke="#1E5245"/>
  <rect x="52" y="294" width="128" height="16" rx="8" fill="#07110E" stroke="#17362E"/>
  <text x="116" y="306" text-anchor="middle" font-size="8.5" letter-spacing="0.8" fill="#34D399">OBSERVED &#183; DEVTOOLS</text>
  <text x="196" y="306" font-size="11" fill="#CBD5E1">Console reported a 404 response for a referenced resource.</text>

  <rect x="40" y="328" width="860" height="38" rx="8" fill="#0B1626" stroke="#1E4A66"/>
  <rect x="52" y="340" width="128" height="16" rx="8" fill="#071018" stroke="#16324A"/>
  <text x="116" y="352" text-anchor="middle" font-size="8.5" letter-spacing="0.8" fill="#38BDF8">REPOSITORY &#183; GITHUB</text>
  <text x="196" y="352" font-size="11" fill="#CBD5E1">The entry HTML references that path relative to the deploy root.</text>

  <rect x="40" y="374" width="860" height="38" rx="8" fill="#0F1220" stroke="#2A3350"/>
  <rect x="52" y="386" width="128" height="16" rx="8" fill="#0B0E1C" stroke="#28314A"/>
  <text x="116" y="398" text-anchor="middle" font-size="8.5" letter-spacing="0.8" fill="#A78BFA">KNOWLEDGE &#183; RAG</text>
  <text x="196" y="398" font-size="11" fill="#CBD5E1">Static-hosting rewrite behaviour for single-page applications.</text>

  <line x1="40" y1="434" x2="900" y2="434" stroke="#1A2233"/>

  <!-- ROOT CAUSE -->
  <text x="40" y="460" font-size="10" letter-spacing="2.4" fill="#FBBF24">ROOT CAUSE &#183; INFERRED</text>
  <text x="40" y="484" font-size="12" fill="#E2E8F0">Most consistent explanation: the asset path does not resolve under the deployed routing</text>
  <text x="40" y="503" font-size="12" fill="#E2E8F0">configuration. Not yet confirmed against the host&#8217;s rewrite rules.</text>

  <!-- CONFIDENCE -->
  <text x="40" y="536" font-size="10" letter-spacing="2.4" fill="#A78BFA">CONFIDENCE</text>
  <rect x="150" y="527" width="560" height="8" rx="4" fill="#161C2B"/>
  <rect x="150" y="527" width="330" height="8" rx="4" fill="#FBBF24"/>
  <text x="726" y="536" font-size="10.5" letter-spacing="1.4" fill="#FBBF24">MEDIUM</text>
  <text x="150" y="556" font-size="9.5" fill="#64748B">two independent evidence sources agree; the host configuration has not been read</text>

  <line x1="40" y1="576" x2="900" y2="576" stroke="#1A2233"/>

  <!-- WHAT THIS MEANS -->
  <text x="40" y="600" font-size="10" letter-spacing="2.4" fill="#A78BFA">WHAT THIS MEANS</text>
  <text x="40" y="622" font-size="11.5" fill="#CBD5E1">The next useful step is to inspect the deployment routing configuration, not to edit the app.</text>

  <!-- RELATED FILES -->
  <text x="40" y="652" font-size="10" letter-spacing="2.4" fill="#A78BFA">RELATED FILES</text>
  <rect x="150" y="638" width="168" height="22" rx="7" fill="#0B1120" stroke="#28314A"/>
  <text x="234" y="653" text-anchor="middle" font-size="10" fill="#94A3B8">frontend/index.html</text>
  <rect x="328" y="638" width="150" height="22" rx="7" fill="#0B1120" stroke="#28314A"/>
  <text x="403" y="653" text-anchor="middle" font-size="10" fill="#94A3B8">deploy config</text>

  <text x="40" y="682" font-size="9.5" fill="#475569">No fix was generated. BRAG proposes remediation only when explicitly asked.</text>
  <text x="900" y="682" text-anchor="end" font-size="9" letter-spacing="1.2" fill="#3A4459">REPRESENTATIVE MOCKUP</text>
</svg>

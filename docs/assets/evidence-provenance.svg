<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" role="img" aria-label="BRAG evidence provenance: observed fact, repository fact and inference are kept distinct" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g5" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111726" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="500" rx="16" fill="#090C16"/>
  <rect width="1000" height="500" rx="16" fill="url(#g5)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="999" height="499" rx="16" fill="none" stroke="#1D2536"/>
  <text x="34" y="34" font-size="11" letter-spacing="3" fill="#475569">EVIDENCE PROVENANCE</text>
  <text x="966" y="34" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#475569">WHAT BRAG KNOWS &#183; WHAT BRAG INFERS</text>

  <!-- OBSERVED -->
  <rect x="60" y="60" width="880" height="112" rx="11" fill="#0B1A16" stroke="#1E5245"/>
  <rect x="60" y="60" width="4" height="112" rx="2" fill="#34D399"/>
  <text x="88" y="90" font-size="13" letter-spacing="1.8" fill="#34D399">OBSERVED FACT</text>
  <text x="88" y="110" font-size="10" fill="#94A3B8">directly returned by a tool or runtime inspection</text>
  <text x="88" y="128" font-size="10" fill="#64748B">source tag: chrome_devtools_mcp &#183; log_mcp</text>
  <rect x="450" y="80" width="466" height="72" rx="8" fill="#07110E" stroke="#17362E"/>
  <text x="470" y="106" font-size="10.5" fill="#7DD3B0">&gt; console inspection &#183; ftc-screener.vercel.app</text>
  <text x="470" y="126" font-size="10.5" fill="#CBD5E1">Failed to load resource: server responded 404</text>
  <text x="470" y="143" font-size="9.5" fill="#64748B">recorded verbatim, persisted to Neon</text>

  <!-- REPOSITORY -->
  <rect x="60" y="188" width="880" height="112" rx="11" fill="#0B1626" stroke="#1E4A66"/>
  <rect x="60" y="188" width="4" height="112" rx="2" fill="#38BDF8"/>
  <text x="88" y="218" font-size="13" letter-spacing="1.8" fill="#38BDF8">REPOSITORY FACT</text>
  <text x="88" y="238" font-size="10" fill="#94A3B8">read from the actual codebase, not recalled</text>
  <text x="88" y="256" font-size="10" fill="#64748B">source tag: github_mcp &#183; context7_mcp</text>
  <rect x="450" y="208" width="466" height="72" rx="8" fill="#071018" stroke="#16324A"/>
  <text x="470" y="234" font-size="10.5" fill="#7CC7EC">&gt; get_file_contents</text>
  <text x="470" y="254" font-size="10.5" fill="#CBD5E1">frontend/index.html references this resource path</text>
  <text x="470" y="271" font-size="9.5" fill="#64748B">targeted read &#183; no repository-wide scan</text>

  <!-- INFERENCE -->
  <rect x="60" y="316" width="880" height="112" rx="11" fill="#1A1408" stroke="#5C4413"/>
  <rect x="60" y="316" width="4" height="112" rx="2" fill="#FBBF24"/>
  <text x="88" y="346" font-size="13" letter-spacing="1.8" fill="#FBBF24">INFERENCE</text>
  <text x="88" y="366" font-size="10" fill="#94A3B8">a conclusion correlated from the facts above</text>
  <text x="88" y="384" font-size="10" fill="#64748B">always labelled, always carries confidence</text>
  <rect x="450" y="336" width="466" height="72" rx="8" fill="#140F05" stroke="#3D2F0C"/>
  <text x="470" y="362" font-size="10.5" fill="#E3B85C">&gt; correlation</text>
  <text x="470" y="382" font-size="10.5" fill="#CBD5E1">the referenced path may explain the observed 404</text>
  <text x="470" y="399" font-size="9.5" fill="#64748B">stated as a hypothesis, never as a verified cause</text>

  <text x="500" y="462" text-anchor="middle" font-size="11.5" letter-spacing="1.2" fill="#94A3B8">An inference is never promoted to a fact just because it sounds convincing.</text>
</svg>

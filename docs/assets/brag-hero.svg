<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="BRAG — Better RAG Agent: evidence-first software investigation engine" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B14"/>
      <stop offset="55%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#0D0A1C"/>
    </linearGradient>
    <linearGradient id="vg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="60%" stop-color="#7C8CF8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#141B2B" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="460" rx="18"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1200" height="460" rx="18" fill="url(#bg)"/>

  <g clip-path="url(#frame)">
    <g opacity="0.85">
      <rect x="-40" y="-40" width="1300" height="560" fill="url(#grid)">
        <animateTransform attributeName="transform" type="translate" values="0 0;-40 -40" dur="14s" repeatCount="indefinite"/>
      </rect>
    </g>
    <ellipse cx="240" cy="150" rx="460" ry="250" fill="url(#glow)"/>
    <ellipse cx="1030" cy="360" rx="380" ry="200" fill="url(#glow2)"/>

    <!-- scan line -->
    <rect x="0" y="0" width="2" height="460" fill="#8B5CF6" opacity="0.20">
      <animate attributeName="x" values="-10;1210" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="459" rx="18" fill="none" stroke="#1D2536"/>

  <!-- status chip -->
  <rect x="48" y="44" width="238" height="30" rx="15" fill="#0E1424" stroke="#2A3350"/>
  <circle cx="66" cy="59" r="4" fill="#34D399">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="64" font-size="12" letter-spacing="2.2" fill="#A78BFA">INVESTIGATION ENGINE</text>

  <!-- right metadata -->
  <g font-size="12" fill="#64748B" text-anchor="end" letter-spacing="0.6">
    <text x="1152" y="55">gemini-embedding-001 · 768d</text>
    <text x="1152" y="77">pgvector · HNSW cosine</text>
    <text x="1152" y="99">81 chunks · 0 ingest errors</text>
  </g>

  <!-- wordmark -->
  <text x="48" y="182" font-size="98" font-weight="700" letter-spacing="8" fill="#F1F5F9">BRAG</text>
  <rect x="52" y="200" width="330" height="2" fill="url(#vg)"/>
  <text x="52" y="232" font-size="17" letter-spacing="9" fill="url(#vg)">BETTER RAG AGENT</text>
  <text x="52" y="266" font-size="15" fill="#94A3B8" letter-spacing="0.4">Evidence-first investigation for software failures.</text>

  <!-- pipeline -->
  <text x="48" y="302" font-size="10.5" letter-spacing="3" fill="#475569">INVESTIGATION PIPELINE</text>

  <g stroke="#2A3350" stroke-width="1.5" fill="none" stroke-dasharray="5 6">
    <path d="M198 348 H235"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M385 348 H422"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M572 348 H609"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M759 348 H796"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/></path>
    <path d="M946 348 H983"><animate attributeName="stroke-dashoffset" values="22;0" dur="1.1s" repeatCount="indefinite"/></path>
  </g>

  <g>
    <!-- 1 SIGNAL -->
    <g>
      <rect x="48" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#A78BFA;#2A3350" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="48" y="316" width="3" height="64" rx="1.5" fill="#A78BFA" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <text x="66" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">SIGNAL</text>
      <text x="66" y="364" font-size="10.5" fill="#64748B">failure report</text>
    </g>
    <!-- 2 RETRIEVE -->
    <g>
      <rect x="235" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#A78BFA;#2A3350" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="235" y="316" width="3" height="64" rx="1.5" fill="#A78BFA" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <text x="253" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">RETRIEVE</text>
      <text x="253" y="364" font-size="10.5" fill="#64748B">hybrid rag</text>
    </g>
    <!-- 3 GATE -->
    <g>
      <rect x="422" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#FBBF24;#2A3350" dur="6s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="422" y="316" width="3" height="64" rx="1.5" fill="#FBBF24" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <text x="440" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">GATE</text>
      <text x="440" y="364" font-size="10.5" fill="#64748B">is this enough?</text>
    </g>
    <!-- 4 EVIDENCE -->
    <g>
      <rect x="609" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#38BDF8;#2A3350" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="609" y="316" width="3" height="64" rx="1.5" fill="#38BDF8" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <text x="627" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">EVIDENCE</text>
      <text x="627" y="364" font-size="10.5" fill="#64748B">targeted mcp</text>
    </g>
    <!-- 5 CORRELATE -->
    <g>
      <rect x="796" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#A78BFA;#2A3350" dur="6s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="796" y="316" width="3" height="64" rx="1.5" fill="#A78BFA" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="814" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">CORRELATE</text>
      <text x="814" y="364" font-size="10.5" fill="#64748B">fact vs inference</text>
    </g>
    <!-- 6 ROOT CAUSE -->
    <g>
      <rect x="983" y="316" width="150" height="64" rx="10" fill="#0D1322" stroke="#2A3350">
        <animate attributeName="stroke" values="#2A3350;#34D399;#2A3350" dur="6s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="983" y="316" width="3" height="64" rx="1.5" fill="#34D399" opacity="0.35">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="6s" begin="4s" repeatCount="indefinite"/>
      </rect>
      <text x="1001" y="345" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">ROOT CAUSE</text>
      <text x="1001" y="364" font-size="10.5" fill="#64748B">with confidence</text>
    </g>
  </g>

  <!-- travelling signal -->
  <circle r="4.5" cy="348" fill="#38BDF8">
    <animate attributeName="cx" values="60;1120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle r="11" cy="348" fill="#38BDF8" opacity="0.18">
    <animate attributeName="cx" values="60;1120" dur="6s" repeatCount="indefinite"/>
  </circle>

  <text x="600" y="424" text-anchor="middle" font-size="13" letter-spacing="6.5" fill="#64748B">INVESTIGATE FIRST &#183; FIX SECOND</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="BRAG roadmap: what exists today and what is planned" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g7" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111726" stroke-width="1"/>
    </pattern>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="18%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#3A4459"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" rx="16" fill="#090C16"/>
  <rect width="1200" height="400" rx="16" fill="url(#g7)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="16" fill="none" stroke="#1D2536"/>

  <text x="34" y="36" font-size="11" letter-spacing="3" fill="#475569">TRAJECTORY</text>
  <g font-size="9.5" letter-spacing="1.2">
    <circle cx="900" cy="32" r="4" fill="#34D399"/><text x="912" y="36" fill="#94A3B8">IMPLEMENTED</text>
    <circle cx="1030" cy="32" r="4" fill="#3A4459"/><text x="1042" y="36" fill="#94A3B8">FUTURE &#183; NOT BUILT</text>
  </g>

  <line x1="46" y1="120" x2="1154" y2="120" stroke="url(#rail)" stroke-width="2"/>
  <g>
    <circle cx="130" cy="120" r="7" fill="#0A0E1A" stroke="#34D399" stroke-width="2"/>
    <circle cx="130" cy="120" r="3" fill="#34D399"/>
    <circle cx="318" cy="120" r="6" fill="#0A0E1A" stroke="#3A4459" stroke-width="2"/>
    <circle cx="506" cy="120" r="6" fill="#0A0E1A" stroke="#3A4459" stroke-width="2"/>
    <circle cx="694" cy="120" r="6" fill="#0A0E1A" stroke="#3A4459" stroke-width="2"/>
    <circle cx="882" cy="120" r="6" fill="#0A0E1A" stroke="#3A4459" stroke-width="2"/>
    <circle cx="1070" cy="120" r="6" fill="#0A0E1A" stroke="#3A4459" stroke-width="2"/>
  </g>

  <!-- NOW -->
  <rect x="46" y="150" width="168" height="150" rx="10" fill="#0B1A16" stroke="#1E5245"/>
  <text x="64" y="176" font-size="9.5" letter-spacing="1.6" fill="#34D399">TODAY</text>
  <text x="64" y="202" font-size="11.5" fill="#E2E8F0">Repository-</text>
  <text x="64" y="219" font-size="11.5" fill="#E2E8F0">aware</text>
  <text x="64" y="236" font-size="11.5" fill="#E2E8F0">investigation</text>
  <text x="64" y="262" font-size="9.5" fill="#94A3B8">RAG &#183; GitHub</text>
  <text x="64" y="277" font-size="9.5" fill="#94A3B8">Context7 &#183; DevTools</text>

  <!-- 2 -->
  <rect x="234" y="150" width="168" height="150" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="252" y="176" font-size="9.5" letter-spacing="1.6" fill="#64748B">FUTURE 01</text>
  <text x="252" y="202" font-size="11.5" fill="#CBD5E1">Sentry MCP</text>
  <text x="252" y="228" font-size="9.5" fill="#94A3B8">production issues,</text>
  <text x="252" y="243" font-size="9.5" fill="#94A3B8">traces and deploy</text>
  <text x="252" y="258" font-size="9.5" fill="#94A3B8">context as evidence</text>
  <text x="252" y="283" font-size="9" fill="#475569">repo-aware &#8594; prod-aware</text>

  <!-- 3 -->
  <rect x="422" y="150" width="168" height="150" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="440" y="176" font-size="9.5" letter-spacing="1.6" fill="#64748B">FUTURE 02</text>
  <text x="440" y="202" font-size="11.5" fill="#CBD5E1">Observability</text>
  <text x="440" y="219" font-size="11.5" fill="#CBD5E1">MCPs</text>
  <text x="440" y="245" font-size="9.5" fill="#94A3B8">Datadog &#183; OpenTelemetry</text>
  <text x="440" y="260" font-size="9.5" fill="#94A3B8">traces, metrics, logs</text>
  <text x="440" y="283" font-size="9" fill="#475569">across a service graph</text>

  <!-- 4 -->
  <rect x="610" y="150" width="168" height="150" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="628" y="176" font-size="9.5" letter-spacing="1.6" fill="#64748B">FUTURE 03</text>
  <text x="628" y="202" font-size="11.5" fill="#CBD5E1">Evidence</text>
  <text x="628" y="219" font-size="11.5" fill="#CBD5E1">graph</text>
  <text x="628" y="245" font-size="9.5" fill="#94A3B8">link facts across</text>
  <text x="628" y="260" font-size="9.5" fill="#94A3B8">every source</text>
  <text x="628" y="283" font-size="9" fill="#475569">multi-hop root cause</text>

  <!-- 5 -->
  <rect x="798" y="150" width="168" height="150" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="816" y="176" font-size="9.5" letter-spacing="1.6" fill="#64748B">FUTURE 04</text>
  <text x="816" y="202" font-size="11.5" fill="#CBD5E1">Investigation</text>
  <text x="816" y="219" font-size="11.5" fill="#CBD5E1">replay</text>
  <text x="816" y="245" font-size="9.5" fill="#94A3B8">an auditable timeline</text>
  <text x="816" y="260" font-size="9.5" fill="#94A3B8">of every step taken</text>
  <text x="816" y="283" font-size="9" fill="#475569">provenance already exists</text>

  <!-- 6 -->
  <rect x="986" y="150" width="168" height="150" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="1004" y="176" font-size="9.5" letter-spacing="1.6" fill="#64748B">FUTURE 05</text>
  <text x="1004" y="202" font-size="11.5" fill="#CBD5E1">Remediation</text>
  <text x="1004" y="219" font-size="11.5" fill="#CBD5E1">handoff</text>
  <text x="1004" y="245" font-size="9.5" fill="#94A3B8">patch, test and PR</text>
  <text x="1004" y="260" font-size="9.5" fill="#94A3B8">after human approval</text>
  <text x="1004" y="283" font-size="9" fill="#FBBF24">explicitly opt-in</text>

  <text x="600" y="352" text-anchor="middle" font-size="11" letter-spacing="3.4" fill="#64748B">RAG &#8594; CODE &#8594; DOCS &#8594; RUNTIME &#8594; OBSERVABILITY &#8594; CROSS-SYSTEM &#8594; REMEDIATION</text>
  <text x="600" y="376" text-anchor="middle" font-size="9.5" fill="#3A4459">nothing to the right of &#8220;today&#8221; is implemented</text>
</svg>

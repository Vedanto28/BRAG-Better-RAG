<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" role="img" aria-label="BRAG provider router, quota awareness, fallback and BYOK credential flow" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g6" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111726" stroke-width="1"/>
    </pattern>
    <marker id="a6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1000" height="550" rx="16" fill="#090C16"/>
  <rect width="1000" height="550" rx="16" fill="url(#g6)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="999" height="549" rx="16" fill="none" stroke="#1D2536"/>
  <text x="34" y="32" font-size="11" letter-spacing="3" fill="#475569">PROVIDER ROUTING &#183; BYOK</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a6)">
    <path d="M500 94 V148"/>
    <path d="M285 174 H340"/>
    <path d="M500 240 V262"/>
  </g>
  <g stroke="#334155" stroke-width="1.4" fill="none">
    <path d="M110 274 V292" marker-end="url(#a6)"/>
    <path d="M266 274 V292" marker-end="url(#a6)"/>
    <path d="M422 274 V292" marker-end="url(#a6)"/>
    <path d="M578 274 V292" marker-end="url(#a6)"/>
    <path d="M734 274 V292" marker-end="url(#a6)"/>
    <path d="M890 274 V292" marker-end="url(#a6)"/>
    <path d="M40 262 H960" stroke-dasharray="4 5"/>
  </g>

  <!-- request -->
  <rect x="400" y="50" width="200" height="44" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <text x="500" y="77" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#E2E8F0">SYNTHESIS REQUEST</text>

  <!-- BYOK rail -->
  <text x="34" y="46" font-size="9.5" letter-spacing="2" fill="#3A4459">BYOK CREDENTIAL PATH</text>
  <rect x="30" y="56" width="255" height="38" rx="9" fill="#0E1424" stroke="#2A3350"/>
  <text x="46" y="80" font-size="10.5" fill="#CBD5E1">user&#8217;s own provider API key</text>
  <rect x="30" y="106" width="255" height="38" rx="9" fill="#0E1424" stroke="#2A3350"/>
  <text x="46" y="130" font-size="10.5" fill="#CBD5E1">held in browser sessionStorage</text>
  <rect x="30" y="156" width="255" height="38" rx="9" fill="#0E1424" stroke="#2A3350"/>
  <text x="46" y="180" font-size="10.5" fill="#C4B5FD">x-byok-[provider]-key header</text>

  <!-- limits -->
  <rect x="710" y="56" width="250" height="184" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="728" y="80" font-size="10.5" letter-spacing="1.6" fill="#38BDF8">QUOTA AWARENESS</text>
  <text x="728" y="104" font-size="10" fill="#94A3B8">60s window &#183; RPM / TPM</text>
  <text x="728" y="122" font-size="10" fill="#94A3B8">24h window &#183; RPD / TPD</text>
  <text x="728" y="146" font-size="9.5" fill="#64748B">tracked in usage_metadata</text>
  <rect x="728" y="162" width="214" height="8" rx="4" fill="#161C2B"/>
  <rect x="728" y="162" width="182" height="8" rx="4" fill="#FBBF24"/>
  <line x1="910" y1="156" x2="910" y2="176" stroke="#FB7185" stroke-width="1.5"/>
  <text x="728" y="192" font-size="9.5" fill="#FBBF24">~85% threshold</text>
  <text x="728" y="212" font-size="9.5" fill="#64748B">the router moves off a provider</text>
  <text x="728" y="226" font-size="9.5" fill="#64748B">before the quota is exhausted</text>

  <!-- router -->
  <rect x="340" y="148" width="320" height="92" rx="11" fill="#120E22" stroke="#8B5CF6"/>
  <text x="500" y="180" text-anchor="middle" font-size="13" letter-spacing="2" fill="#E9E4FF">PROVIDER ROUTER</text>
  <text x="500" y="202" text-anchor="middle" font-size="10" fill="#94A3B8">one place decides which model answers</text>
  <text x="500" y="222" text-anchor="middle" font-size="9.5" fill="#6D5BA6">credential override &#183; limit check &#183; fallback</text>

  <!-- providers -->
  <g>
    <rect x="40" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="110" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">Gemini</text>
    <text x="110" y="335" text-anchor="middle" font-size="9" fill="#34D399">real call verified</text>

    <rect x="196" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="266" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">Groq</text>
    <text x="266" y="335" text-anchor="middle" font-size="9" fill="#34D399">real call verified</text>

    <rect x="352" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="422" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">OpenAI</text>
    <text x="422" y="335" text-anchor="middle" font-size="9" fill="#64748B">configured</text>

    <rect x="508" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="578" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">OpenRouter</text>
    <text x="578" y="335" text-anchor="middle" font-size="9" fill="#64748B">configured</text>

    <rect x="664" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="734" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">Cerebras</text>
    <text x="734" y="335" text-anchor="middle" font-size="9" fill="#64748B">configured</text>

    <rect x="820" y="292" width="140" height="56" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="890" y="317" text-anchor="middle" font-size="11.5" fill="#E2E8F0">DeepSeek</text>
    <text x="890" y="335" text-anchor="middle" font-size="9" fill="#64748B">configured</text>
  </g>

  <!-- routing pulse -->
  <circle r="4" cy="262" fill="#A78BFA">
    <animate attributeName="cx" values="500;110;500;266;500;890;500" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2;1;0.2;1;0.2" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- fallback -->
  <rect x="40" y="376" width="920" height="52" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="60" y="399" font-size="10.5" letter-spacing="1.4" fill="#38BDF8">FALLBACK</text>
  <text x="160" y="399" font-size="10.5" fill="#CBD5E1">provider unavailable or quota-constrained &#8594; select another configured provider &#8594; continue the investigation</text>
  <text x="160" y="417" font-size="9.5" fill="#64748B">a quota failure should not end a developer&#8217;s investigation</text>

  <!-- security -->
  <rect x="40" y="446" width="920" height="76" rx="10" fill="#0B1A16" stroke="#1E5245"/>
  <text x="60" y="470" font-size="10.5" letter-spacing="1.6" fill="#34D399">BYOK KEYS ARE EPHEMERAL</text>
  <g font-size="10" fill="#94A3B8">
    <text x="60" y="492">not written to the database</text>
    <text x="300" y="492">not written to localStorage</text>
    <text x="560" y="492">not placed in URLs</text>
    <text x="770" y="492">not logged</text>
    <text x="60" y="511">not echoed in responses</text>
    <text x="300" y="511">used only as a request-time credential override</text>
    <text x="700" y="511" fill="#64748B">provider identity may be kept for audit</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" role="img" aria-label="BRAG system architecture" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#111726" stroke-width="1"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="730" rx="16" fill="#090C16"/>
  <rect width="1200" height="730" rx="16" fill="url(#g3)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="1199" height="729" rx="16" fill="none" stroke="#1D2536"/>

  <text x="36" y="36" font-size="11" letter-spacing="3" fill="#475569">SYSTEM ARCHITECTURE</text>

  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#a3)">
    <path d="M600 112 V132"/>
    <path d="M600 222 V242"/>
    <path d="M469 422 V448"/>
    <path d="M731 422 V448"/>
    <path d="M993 422 V448"/>
    <path d="M600 570 V596"/>
  </g>

  <!-- CLIENT -->
  <rect x="60" y="52" width="1080" height="60" rx="11" fill="#0E1424" stroke="#2A3350"/>
  <rect x="60" y="52" width="3" height="60" rx="1.5" fill="#A78BFA"/>
  <text x="84" y="79" font-size="13" letter-spacing="1.6" fill="#E2E8F0">BRAG WORKBENCH</text>
  <text x="84" y="97" font-size="10.5" fill="#64748B">React &#183; Vite &#183; Midnight Lab design system &#183; investigation history &#183; BYOK hub</text>
  <text x="1116" y="86" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#475569">CLIENT</text>

  <!-- API -->
  <rect x="60" y="132" width="1080" height="90" rx="11" fill="#0E1424" stroke="#2A3350"/>
  <rect x="60" y="132" width="3" height="90" rx="1.5" fill="#A78BFA"/>
  <text x="84" y="158" font-size="13" letter-spacing="1.6" fill="#E2E8F0">EXPRESS API LAYER</text>
  <text x="1116" y="158" text-anchor="end" font-size="10" letter-spacing="1.4" fill="#475569">HTTPS</text>
  <g font-size="10.5" fill="#94A3B8">
    <rect x="84" y="172" width="150" height="30" rx="7" fill="#0B1120" stroke="#28314A"/><text x="100" y="192">POST /api/chat</text>
    <rect x="246" y="172" width="150" height="30" rx="7" fill="#0B1120" stroke="#28314A"/><text x="262" y="192">GET /api/health</text>
    <rect x="408" y="172" width="150" height="30" rx="7" fill="#0B1120" stroke="#28314A"/><text x="424" y="192">GET /api/sse</text>
    <rect x="570" y="172" width="176" height="30" rx="7" fill="#0B1120" stroke="#28314A"/><text x="586" y="192">POST /api/messages</text>
  </g>
  <text x="770" y="192" font-size="10" fill="#64748B">validation &#183; context caps &#183; history limits &#183; timeouts</text>

  <!-- ORCHESTRATOR -->
  <rect x="60" y="242" width="1080" height="180" rx="12" fill="#0B0E1C" stroke="#3A2E63"/>
  <text x="84" y="270" font-size="13" letter-spacing="2" fill="#C4B5FD">MECHAMARU &#8212; AGENT ORCHESTRATOR</text>
  <text x="1116" y="270" text-anchor="end" font-size="10" letter-spacing="1.2" fill="#6D5BA6">max 3 agent steps &#183; max 2 tool calls</text>

  <g>
    <rect x="84" y="288" width="246" height="118" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="102" y="313" font-size="11.5" letter-spacing="1.2" fill="#E2E8F0">COMPLEXITY</text>
    <text x="102" y="330" font-size="11.5" letter-spacing="1.2" fill="#E2E8F0">CLASSIFIER</text>
    <text x="102" y="354" font-size="10" fill="#64748B">low &#183; medium &#183; high</text>
    <text x="102" y="372" font-size="10" fill="#8B93A7">250 / 500 / 900 tokens</text>
    <text x="102" y="392" font-size="9.5" fill="#475569">adaptive diagnostic depth</text>

    <rect x="346" y="288" width="246" height="118" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="364" y="313" font-size="11.5" letter-spacing="1.2" fill="#E2E8F0">HYBRID RAG</text>
    <text x="364" y="337" font-size="10" fill="#64748B">vector similarity</text>
    <text x="364" y="355" font-size="10" fill="#64748B">keyword ranking</text>
    <text x="364" y="373" font-size="10" fill="#8B93A7">reciprocal rank fusion</text>
    <text x="364" y="392" font-size="9.5" fill="#475569">top-k technical context</text>

    <rect x="608" y="288" width="246" height="118" rx="10" fill="#0E1424" stroke="#4A3B12"/>
    <text x="626" y="313" font-size="11.5" letter-spacing="1.2" fill="#FBBF24">EVIDENCE GATE</text>
    <text x="626" y="337" font-size="10" fill="#64748B">sufficiency check</text>
    <text x="626" y="355" font-size="10" fill="#64748B">conditional MCP init</text>
    <text x="626" y="373" font-size="10" fill="#8B93A7">targeted tool selection</text>
    <text x="626" y="392" font-size="9.5" fill="#475569">escalate only when needed</text>

    <rect x="870" y="288" width="246" height="118" rx="10" fill="#0E1424" stroke="#2A3350"/>
    <text x="888" y="313" font-size="11.5" letter-spacing="1.2" fill="#E2E8F0">PROVIDER ROUTER</text>
    <text x="888" y="337" font-size="10" fill="#64748B">quota / rate awareness</text>
    <text x="888" y="355" font-size="10" fill="#64748B">fallback selection</text>
    <text x="888" y="373" font-size="10" fill="#8B93A7">BYOK credential override</text>
    <text x="888" y="392" font-size="9.5" fill="#475569">~85% limit threshold</text>
  </g>

  <!-- EXTERNAL PLANE -->
  <rect x="346" y="448" width="246" height="122" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="364" y="472" font-size="11" letter-spacing="1.2" fill="#A78BFA">VECTOR STORE</text>
  <text x="364" y="496" font-size="10" fill="#94A3B8">Neon PostgreSQL</text>
  <text x="364" y="514" font-size="10" fill="#94A3B8">pgvector &#183; HNSW cosine</text>
  <text x="364" y="532" font-size="10" fill="#64748B">knowledge_chunks</text>
  <text x="364" y="552" font-size="10" fill="#64748B">gemini-embedding-001 &#183; 768d</text>

  <rect x="608" y="448" width="246" height="122" rx="10" fill="#0B1626" stroke="#1E4A66"/>
  <text x="626" y="472" font-size="11" letter-spacing="1.2" fill="#38BDF8">MCP EVIDENCE</text>
  <text x="626" y="496" font-size="10" fill="#94A3B8">GitHub &#183; repository</text>
  <text x="626" y="514" font-size="10" fill="#94A3B8">Context7 &#183; library docs</text>
  <text x="626" y="532" font-size="10" fill="#94A3B8">Chrome DevTools &#183; runtime</text>
  <text x="626" y="552" font-size="10" fill="#64748B">internal / Neon evidence</text>

  <rect x="870" y="448" width="246" height="122" rx="10" fill="#0B1120" stroke="#28314A"/>
  <text x="888" y="472" font-size="11" letter-spacing="1.2" fill="#34D399">LLM PROVIDERS</text>
  <text x="888" y="496" font-size="10" fill="#94A3B8">Gemini &#183; Groq &#183; OpenAI</text>
  <text x="888" y="514" font-size="10" fill="#94A3B8">OpenRouter &#183; Cerebras</text>
  <text x="888" y="532" font-size="10" fill="#94A3B8">DeepSeek</text>
  <text x="888" y="552" font-size="10" fill="#64748B">central routing, not scattered</text>

  <!-- PERSISTENCE -->
  <rect x="60" y="596" width="1080" height="92" rx="11" fill="#0E1424" stroke="#2A3350"/>
  <rect x="60" y="596" width="3" height="92" rx="1.5" fill="#C4B5FD"/>
  <text x="84" y="622" font-size="13" letter-spacing="1.6" fill="#E2E8F0">NEON POSTGRESQL &#8212; INVESTIGATION PERSISTENCE</text>
  <g font-size="10" fill="#94A3B8">
    <rect x="84" y="638" width="132" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="100" y="657">investigations</text>
    <rect x="228" y="638" width="112" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="244" y="657">messages</text>
    <rect x="352" y="638" width="108" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="368" y="657">evidence</text>
    <rect x="472" y="638" width="164" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="488" y="657">diagnostic_reports</text>
    <rect x="648" y="638" width="146" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="664" y="657">usage_metadata</text>
    <rect x="806" y="638" width="152" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="822" y="657">knowledge_chunks</text>
    <rect x="970" y="638" width="86" height="28" rx="7" fill="#0B1120" stroke="#28314A"/><text x="986" y="657">users</text>
  </g>
  <text x="84" y="682" font-size="9.5" fill="#475569">every investigation keeps its messages, evidence provenance, diagnostic report and usage metadata</text>
</svg>

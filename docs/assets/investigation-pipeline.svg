<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700" role="img" aria-label="BRAG investigation lifecycle with conditional evidence gate" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#121828" stroke-width="1"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <marker id="arv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#A78BFA"/>
    </marker>
  </defs>

  <rect width="1100" height="700" rx="16" fill="#090C16"/>
  <rect width="1100" height="700" rx="16" fill="url(#g2)" opacity="0.7"/>
  <rect x="0.5" y="0.5" width="1099" height="699" rx="16" fill="none" stroke="#1D2536"/>

  <text x="36" y="40" font-size="11" letter-spacing="3" fill="#475569">INVESTIGATION LIFECYCLE</text>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#ar)">
    <path d="M550 86 V104"/>
    <path d="M550 172 V190"/>
    <path d="M550 258 V266"/>
  </g>

  <!-- branch rails -->
  <g stroke="#334155" stroke-width="1.6" fill="none">
    <path d="M400 318 H210 V486" marker-end="url(#ar)"/>
    <path d="M700 318 H890 V386" marker-end="url(#ar)"/>
    <path d="M890 450 V486" marker-end="url(#ar)"/>
    <path d="M210 486 H550" stroke-dasharray="4 5"/>
    <path d="M890 486 H550" stroke-dasharray="4 5"/>
    <path d="M550 486 V506" marker-end="url(#ar)"/>
    <path d="M550 566 V596" marker-end="url(#arv)" stroke="#A78BFA"/>
  </g>

  <!-- flowing signal on main spine -->
  <g stroke="#38BDF8" stroke-width="1.6" fill="none" stroke-dasharray="6 10" opacity="0.65">
    <path d="M550 86 V266">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="1.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- 1 user query -->
  <rect x="425" y="36" width="250" height="50" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <text x="550" y="60" text-anchor="middle" font-size="12.5" letter-spacing="1.6" fill="#E2E8F0">USER QUERY</text>
  <text x="550" y="77" text-anchor="middle" font-size="10" fill="#64748B">validated &#183; bounded input</text>

  <!-- 2 classifier -->
  <rect x="395" y="104" width="310" height="68" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="395" y="104" width="3" height="68" rx="1.5" fill="#A78BFA"/>
  <text x="415" y="129" font-size="12.5" letter-spacing="1.4" fill="#E2E8F0">COMPLEXITY CLASSIFIER</text>
  <text x="415" y="148" font-size="10" fill="#64748B">sets adaptive output budget</text>
  <text x="415" y="164" font-size="10" fill="#8B93A7">low 250 &#183; medium 500 &#183; high 900 tokens</text>

  <!-- 3 hybrid rag -->
  <rect x="370" y="190" width="360" height="68" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="370" y="190" width="3" height="68" rx="1.5" fill="#A78BFA"/>
  <text x="390" y="215" font-size="12.5" letter-spacing="1.4" fill="#E2E8F0">HYBRID RAG RETRIEVAL</text>
  <text x="390" y="234" font-size="10" fill="#64748B">vector + keyword, fused with RRF</text>
  <text x="390" y="250" font-size="10" fill="#8B93A7">pgvector &#183; HNSW cosine &#183; 81 chunks</text>

  <!-- 4 gate -->
  <polygon points="550,272 700,318 550,364 400,318" fill="#141021" stroke="#FBBF24" stroke-width="1.4">
    <animate attributeName="stroke-opacity" values="0.45;1;0.45" dur="3.4s" repeatCount="indefinite"/>
  </polygon>
  <text x="550" y="314" text-anchor="middle" font-size="12" letter-spacing="1.6" fill="#FBBF24">EVIDENCE GATE</text>
  <text x="550" y="331" text-anchor="middle" font-size="10" fill="#94A3B8">is local knowledge enough?</text>

  <text x="300" y="308" text-anchor="middle" font-size="10.5" letter-spacing="1.4" fill="#34D399">YES &#183; SUFFICIENT</text>
  <text x="800" y="308" text-anchor="middle" font-size="10.5" letter-spacing="1.4" fill="#38BDF8">NO &#183; ESCALATE</text>

  <!-- left rail note -->
  <text x="210" y="410" text-anchor="middle" font-size="10" fill="#64748B">answer from</text>
  <text x="210" y="426" text-anchor="middle" font-size="10" fill="#64748B">retrieved knowledge</text>
  <text x="210" y="446" text-anchor="middle" font-size="10" letter-spacing="1.2" fill="#34D399">MCP BYPASSED</text>

  <!-- 5 mcp -->
  <rect x="735" y="386" width="310" height="64" rx="10" fill="#0B1626" stroke="#1E4A66"/>
  <rect x="735" y="386" width="3" height="64" rx="1.5" fill="#38BDF8"/>
  <text x="755" y="410" font-size="12.5" letter-spacing="1.4" fill="#E2E8F0">TARGETED MCP EVIDENCE</text>
  <text x="755" y="428" font-size="10" fill="#64748B">github &#183; context7 &#183; chrome devtools &#183; internal</text>
  <text x="755" y="444" font-size="10" fill="#38BDF8">max 2 tool calls &#183; no repo-wide scanning</text>

  <!-- 6 synthesis -->
  <rect x="380" y="506" width="340" height="60" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="380" y="506" width="3" height="60" rx="1.5" fill="#A78BFA"/>
  <text x="400" y="531" font-size="12.5" letter-spacing="1.4" fill="#E2E8F0">EVIDENCE-AWARE SYNTHESIS</text>
  <text x="400" y="550" font-size="10" fill="#64748B">observed fact &#183; repository fact &#183; inference</text>

  <!-- 7 diagnostic -->
  <rect x="380" y="596" width="340" height="62" rx="10" fill="#0F1626" stroke="#8B5CF6"/>
  <text x="550" y="622" text-anchor="middle" font-size="12.5" letter-spacing="1.8" fill="#E9E4FF">STRUCTURED DIAGNOSTIC</text>
  <text x="550" y="641" text-anchor="middle" font-size="10" fill="#94A3B8">finding &#183; evidence &#183; root cause &#183; confidence</text>

  <!-- persistence rail -->
  <g stroke="#2A3350" stroke-width="1.2" stroke-dasharray="3 5" fill="none">
    <path d="M1000 450 V596"/>
    <path d="M720 536 H1000"/>
  </g>
  <text x="756" y="530" font-size="9" fill="#475569">persist evidence + report</text>
  <rect x="930" y="596" width="140" height="62" rx="10" fill="#0E1424" stroke="#2A3350"/>
  <rect x="930" y="596" width="3" height="62" rx="1.5" fill="#C4B5FD"/>
  <text x="1004" y="624" text-anchor="middle" font-size="11" letter-spacing="1.4" fill="#C4B5FD">NEON</text>
  <text x="1004" y="641" text-anchor="middle" font-size="9" fill="#64748B">evidence &#183; reports</text>
</svg>
